name: Deploy to GitHub Pages

# Started by hand: Actions → "Deploy to GitHub Pages" → Run workflow, then type the branch to publish.
run-name: Deploy ${{ inputs.branch }} to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Check the branch can run on GitHub Pages
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if ! grep -q "HashRouter" src/App.tsx; then
            echo "::error::Branch '$BRANCH' uses BrowserRouter, which breaks on GitHub Pages. Merge feat/github-pages (or main, once it has it) into '$BRANCH' first."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test --if-present
      # --base=./ keeps asset paths relative even if the branch's vite.config.ts lacks it
      - run: npm run build -- --base=./

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
